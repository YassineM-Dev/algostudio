name: Build & Publish AlgoStudio Auto-Update

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows Installer, Portable EXE, blockmap & latest.yml
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build && npx electron-builder --win --publish never

      - name: Verify update artifacts & publish single GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            "release/AlgoStudio-Setup.exe",
            "release/AlgoStudio-Setup.exe.blockmap",
            "release/AlgoStudio-Portable.exe",
            "release/latest.yml"
          )

          foreach ($asset in $assets) {
            if (!(Test-Path $asset)) {
              Write-Error "Artefact manquant dans release/: $asset"
              Get-ChildItem release/ | Format-Table Name, Length
              exit 1
            }
          }

          Write-Host "=== Contenu de release/latest.yml ==="
          Get-Content "release/latest.yml"

          $notes = @(
            "## AlgoStudio $tag — Téléchargement direct (Windows)",
            "",
            "- **Installateur Windows (Recommandé — Mises à jour automatiques)** : [Télécharger AlgoStudio-Setup.exe](https://github.com/YassineM-Dev/algostudio/releases/latest/download/AlgoStudio-Setup.exe)",
            "- **Version Portable (Sans installation)** : [Télécharger AlgoStudio-Portable.exe](https://github.com/YassineM-Dev/algostudio/releases/latest/download/AlgoStudio-Portable.exe)",
            "",
            "> Les utilisateurs ayant déjà installé **AlgoStudio Setup** reçoivent cette mise à jour automatiquement au démarrage (ou via **Fichier → Mises à jour**)."
          ) -join "`n"
          Set-Content -Path "release_notes.md" -Value $notes -Encoding UTF8

          # Remove any pre-existing release with the same tag to guarantee a single clean release (no duplicate race condition)
          $ErrorActionPreference = 'Continue'
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes
          }
          $ErrorActionPreference = 'Stop'

          gh release create $tag `
            "release/AlgoStudio-Setup.exe" `
            "release/AlgoStudio-Setup.exe.blockmap" `
            "release/AlgoStudio-Portable.exe" `
            "release/latest.yml" `
            --title "AlgoStudio $tag" `
            --notes-file "release_notes.md" `
            --latest
